name: CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  static-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            composition-cli:
              - 'packages/composition-cli/**'
              - 'package.json'
              - 'yarn.lock'
              - '.github/workflows/static.yaml'

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.4.1
          cache: yarn

      - name: Install dependencies
        run: yarn --immutable

      - name: Check formatting
        run: yarn format:check

      - name: Build SDK
        run: yarn build

      - name: Check lint
        run: yarn lint

      - name: Check typing
        run: yarn typecheck

      - name: Unit tests
        run: yarn workspace @fishjam-cloud/composition test

      - name: Composition CLI unit tests
        if: steps.changes.outputs.composition-cli == 'true'
        run: yarn workspace @fishjam-cloud/composition-cli test

      - name: Check TypeDoc generation
        run: yarn docs

      - name: Spellcheck
        run: yarn spellcheck
